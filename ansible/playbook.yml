---
# ==========================================
# PIÈCE 1 : INSTALLATION DOCKER (Noeuds Swarm)
# ==========================================
- name: Préparation des noeuds Swarm
  hosts: role_manager:role_worker
  become: yes
  tasks:
    - name: Installation des dépendances
      ansible.builtin.apt:
        name: ['ca-certificates', 'curl', 'gnupg', 'lsb-release']
        state: present
        update_cache: yes

    - name: Création du dossier pour la clé GPG
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajout de la clé GPG Docker
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Ajout du dépôt Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable"
        state: present

    - name: Installation de Docker CE
      ansible.builtin.apt:
        name: ['docker-ce', 'docker-ce-cli', 'containerd.io']
        state: present
        update_cache: yes

# ==========================================
# PIÈCE 2 : INITIALISATION DU CLUSTER SWARM
# ==========================================
- name: Configuration du Swarm Manager
  hosts: role_manager
  become: yes
  tasks:
    - name: Vérifier si Swarm est déjà actif
      ansible.builtin.command: docker info
      register: docker_info
      changed_when: false

    - name: Initialisation du Swarm
      # On utilise l'IP privée de la machine donnée automatiquement par AWS
      ansible.builtin.command: "docker swarm init --advertise-addr {{ private_ip_address }}"
      when: "'Swarm: inactive' in docker_info.stdout"

    - name: Récupération du token pour les workers
      ansible.builtin.command: docker swarm join-token -q worker
      register: worker_token
      changed_when: false

    - name: Mémorisation du token (Variable globale)
      ansible.builtin.set_fact:
        swarm_token: "{{ worker_token.stdout }}"

- name: Configuration du Swarm Worker
  hosts: role_worker
  become: yes
  tasks:
    - name: Vérifier si le Worker est déjà dans un Swarm
      ansible.builtin.command: docker info
      register: docker_info_worker
      changed_when: false

    - name: Le Worker rejoint le cluster
      ansible.builtin.command: "docker swarm join --token {{ hostvars[groups['role_manager'][0]]['swarm_token'] }} {{ hostvars[groups['role_manager'][0]]['private_ip_address'] }}:2377"
      when: "'Swarm: inactive' in docker_info_worker.stdout"

# ==========================================
# PIÈCE 3 : DÉPLOIEMENT DU JEU & MONITORING (Noeuds Swarm)
# ==========================================
- name: Déploiement de l'application
  hosts: role_manager
  become: yes
  tasks:
    - name: Lancement du service Pokito Poker sur Swarm
      ansible.builtin.shell: |
        if docker service ls | grep -q pokito_game; then
          docker service update --image ghcr.io/lasreex/bloc5_pokito:latest pokito_game
        else
          docker service create --name pokito_game -p 80:80 --replicas 2 ghcr.io/lasreex/bloc5_pokito:latest
        fi
      args:
        executable: /bin/bash
    
    - name: On s'assure que le dossier de monitoring existe
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - /opt/monitoring/
        - /opt/monitoring/grafana/provisioning/datasources
        - /opt/monitoring/grafana/provisioning/dashboards
        - /opt/monitoring/grafana/dashboards
      
    - name: Nettoyage de l'ancien Dashboard cAdvisor
      ansible.builtin.file:
        path: /opt/monitoring/grafana/dashboards/cadvisor.json
        state: absent

    - name: Configuration de Grafana (Datasource et Dashboard Provider)
      ansible.builtin.copy:
        dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: Prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true

    - name: Configuration du Provider de Dashboard
      ansible.builtin.copy:
        dest: /opt/monitoring/grafana/provisioning/dashboards/provider.yml
        content: |
          apiVersion: 1
          providers:
            - name: 'Pokito Dashboards'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              options:
                path: /var/lib/grafana/dashboards

    - name: Téléchargement du Dashboard Docker (cAdvisor)
      ansible.builtin.get_url:
        url: https://grafana.com/api/dashboards/14282/revisions/1/download
        dest: /opt/monitoring/grafana/dashboards/cadvisor.json

    - name: Patch dynamique de la Datasource (Répare les variables)
      replace:
        path: /opt/monitoring/grafana/dashboards/cadvisor.json
        # Cette expression régulière trouve les anciennes liaisons de base de données 
        # et les force à pointer vers le nouvel identifiant "Prometheus" de Grafana
        regexp: '(?<="datasource":\s)(?:null|"[^"]+")'
        replace: '{"type":"prometheus","uid":"Prometheus"}'

    - name: Injection de la configuration Prometheus
      ansible.builtin.copy:
        dest: /opt/monitoring/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
          
          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']
            
            # Découverte automatique des agents système (Node Exporter)
            - job_name: 'node_exporter'
              dns_sd_configs:
                - names: ['tasks.node_exporter']
                  type: 'A'
                  port: 9100
            
            # Découverte automatique des agents conteneurs (cAdvisor)
            - job_name: 'cadvisor'
              dns_sd_configs:
                - names: ['tasks.cadvisor']
                  type: 'A'
                  port: 8080

    - name: Injection de la stack Docker Compose Monitoring
      ansible.builtin.copy:
        dest: /opt/monitoring/docker-compose.yml
        content: |
          version: '3.8'
          services:
            prometheus:
              image: prom/prometheus:latest
              volumes:
                - /opt/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
              ports:
                - "9090:9090"
              deploy:
                placement:
                  constraints: [node.role == manager]
            
            grafana:
              image: grafana/grafana:latest
              ports:
                - "3000:3000"
              environment:
                - GF_SECURITY_ADMIN_PASSWORD=pokitoadmin
              volumes: 
                - /opt/monitoring/grafana/provisioning:/etc/grafana/provisioning
                - /opt/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
              deploy:
                placement:
                  constraints: [node.role == manager]
            
            # L'agent Système (Déployé sur TOUS les noeuds)
            node_exporter:
              image: prom/node-exporter:latest
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - '--path.procfs=/host/proc'
                - '--path.sysfs=/host/sys'
              deploy:
                mode: global
            
            # L'agent Conteneur (Déployé sur TOUS les noeuds)
            cadvisor:
              image: gcr.io/cadvisor/cadvisor:latest
              volumes:
                - /:/rootfs:ro
                - /var/run:/var/run:ro
                - /sys:/sys:ro
                - /var/lib/docker/:/var/lib/docker:ro
              deploy:
                mode: global
      
    - name: Lancement de la stack Monitoring sur Swarm
      command: docker stack deploy -c /opt/monitoring/docker-compose.yml monitoring

